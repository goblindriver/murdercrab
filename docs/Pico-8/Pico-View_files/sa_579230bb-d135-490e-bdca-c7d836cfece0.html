<script type="text/javascript">


        var App = new Vue({
            el: "#goal-overlay-app",
            data: {
                title: 'Player Movement Reference',
                percentage: '100',
                currency: '$',
                amount: '500',
                showGoal: 'True',
                goalInfo: ''
            },
            methods: {

                handleUpdate: function(message) {
                    try {
                        var model = JSON.parse(message);

                        //Config reset logic
                        if (model.Title.indexOf("configreset_sa_579230bb-d135-490e-bdca-c7d836cfece0") != -1) {
                            location.reload();
                            return;
                        }

                        if (model.GoalAmount == null){
                            this.goalInfo = '';
                            this.percentage = 0;
                            this.title = 'No goal set :(';
                        }
                        else{
                            if (model.ShowGoal){
                                this.goalInfo = model.ProgressPercentage + '% of ' + model.Currency + model.GoalAmount + ' Goal';
                            }
                            else {
                                this.goalInfo = model.ProgressPercentage + '% of Goal';
                            }

                            this.percentage = model.ProgressPercentage;
                            this.title = model.Title;

                            if (!model.Title || model.Title.length == 0){
                                this.title = 'Ko-fi Goal'
                            }
                        };

                        console.log('Goal updated!');

                        this.trackAlert(false, null);
                    }
                    catch (err) {
                        this.trackAlert(true, err);
                    }

                },

                getAxiosConfig: function () {
                    const config = {
                        headers: {'x-ms-signalr-userid': 'kK-pl-256uc6Vgc-pl-eLiGHIQ0Au-s-vc5hiTI33ur6pe-pl-ydLpzZr-pl-Foga3h2BjM0dwbKYR'}
                    };
                    return config;
                },

                trackAlert: function(isError, message) {
                    try {
                        $.get(`/streamalerts/TrackGoalOverlayUpdate?key=sa_579230bb-d135-490e-bdca-c7d836cfece0&message=${message}&isError=${isError}`, function (data) {
                            console.log("T:1");
                        });
                    }
                    catch (err) {
                        console.log("T:0");}
                },

                getConnectionInfo: function() {

                    var ref = this;

                    $.ajax({
                        url: "/api/streamalerts/negotiation-token?userKey=sa_579230bb-d135-490e-bdca-c7d836cfece0", success: function (response) {
                            axios.post(`https://sa-functions.ko-fi.com/api/negotiate?negotiationToken=${response.token}&pageId=E1E0N0SA&timestamp=2026_4_11_23_11_50_498`, null, ref.getAxiosConfig())
                            .then(resp => resp.data)
                            .then(info => {
                                // make compatible with old and new SignalRConnectionInfo
                                info.accessToken = info.accessToken || info.accessKey;
                                info.url = info.url || info.endpoint;

                                const options = {
                                    accessTokenFactory: () => info.accessToken
                                };

                                const connection = new signalR.HubConnectionBuilder()
                                    .withUrl(info.url, options)
                                    .configureLogging(signalR.LogLevel.Information)
                                    .configureLogging(signalR.LogLevel.Error)
                                    .withAutomaticReconnect()
                                    .build();

                                window.realtimeConnection = connection;

                                connection.on('updateGoalOverlay', ref.handleUpdate);
                                connection.onreconnecting(error => {
                                    console.log('Reconnecting...');
                                    ref.trackAlert(true, error);
                                });

                                connection.onreconnected(connectionId => {
                                    console.log('Reconnected.');
                                });

                                connection.onclose(error => {
                                    console.log('Could not reconnect');
                                    location.reload();
                                });

                                console.log('connecting...');
                                connection.start()
                                    .then(() => {
                                        console.log('Connected!');
                                    })
                                    .catch(console.error);
                            })
                            .catch(function (e) {
                                console.log(`Could not connect: ${e}`);
                                ref.trackAlert(true, e);
                            })
                        }, cache: false
                    });

                }
            },
            mounted() {
                console.log('started ' + Date().toLocaleString());

                if (this.amount == null){
                    this.goalInfo = '';
                    this.percentage = 0;
                    this.title = 'No goal set :(';
                }
                else {
                    if (this.showGoal == "True") {
                        this.goalInfo = this.percentage + '% of ' + this.currency + this.amount + ' Goal';
                    }
                    else {
                        this.goalInfo = this.percentage + '% of Goal';
                    }

                    if (!this.title || this.title.length == 0){
                        this.title = 'Ko-fi Goal'
                    }
                };

                this.getConnectionInfo();
            }
        });
</script>
